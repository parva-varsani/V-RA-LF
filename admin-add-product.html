<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VÉRA Atelier Admin — Add / Edit Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Jost:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="adminShell" class="admin-shell">
      <aside class="admin-sidebar">
        <div>
          <div class="p-4 border-bottom d-flex justify-content-between align-items-center" style="border-color: var(--admin-border) !important;">
            <div>
              <div class="vera-brand admin-brand-word fs-5">VÉRA</div>
              <div class="admin-brand-sub font-display ls-wide text-muted-vera mt-1" style="font-size:9px;">Atelier Console</div>
            </div>
            <button type="button" id="adminSidebarToggle" class="btn btn-link p-0 text-reset" aria-label="Toggle sidebar">
              <i class="bi bi-layout-sidebar"></i>
            </button>
          </div>
          <nav class="mt-2">
            <a href="admin-dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i><span class="admin-nav-label">Dashboard</span></a>
            <a href="admin-products.html" class="admin-nav-link"><i class="bi bi-box-seam"></i><span class="admin-nav-label">Products</span></a>
            <a href="admin-add-product.html" class="admin-nav-link active"><i class="bi bi-plus-square"></i><span class="admin-nav-label">Add Product</span></a>
            <a href="admin-orders.html" class="admin-nav-link"><i class="bi bi-receipt"></i><span class="admin-nav-label">Orders</span></a>
            <a href="admin-customers.html" class="admin-nav-link"><i class="bi bi-people"></i><span class="admin-nav-label">Customers</span></a>
          </nav>
        </div>
        <div class="p-3 border-top" style="border-color: var(--admin-border) !important;">
          <a href="index.html" class="admin-nav-link px-2">
            <i class="bi bi-arrow-up-right-square"></i>
            <span class="admin-nav-label">View Live Store</span>
          </a>
        </div>
      </aside>

      <div class="offcanvas offcanvas-start" tabindex="-1" id="adminMobileNav">
        <div class="offcanvas-header border-bottom" style="border-color: var(--admin-border) !important;">
          <span class="vera-brand fs-5">VÉRA ADMIN</span>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
          <a href="admin-dashboard.html" class="admin-nav-link">Dashboard</a>
          <a href="admin-products.html" class="admin-nav-link">Products</a>
          <a href="admin-add-product.html" class="admin-nav-link active">Add Product</a>
          <a href="admin-orders.html" class="admin-nav-link">Orders</a>
          <a href="admin-customers.html" class="admin-nav-link">Customers</a>
          <a href="index.html" class="admin-nav-link border-top">View Live Store</a>
        </div>
      </div>

      <div class="admin-main">
        <header class="admin-topbar">
          <div class="d-flex align-items-center gap-3">
            <button type="button" class="btn btn-vera-subtle d-lg-none px-2 py-1" data-bs-toggle="offcanvas" data-bs-target="#adminMobileNav">
              <i class="bi bi-list"></i>
            </button>
            <h1 id="formPageTitle" class="font-display ls-editorial fs-6 fw-normal mb-0">Add New Product</h1>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button type="button" id="adminThemeToggle" class="btn btn-vera-subtle px-3 py-1"></button>
            <a href="admin-products.html" class="btn btn-vera-outline px-3 py-1">Back to Catalog</a>
          </div>
        </header>

        <main class="p-4 p-lg-5 flex-fill">
          <div class="row g-4">
            <div class="col-12 col-lg-8">
              <div class="admin-card">
                <form id="productForm">
                  <input type="hidden" id="prodId" />
                  <div class="row g-3">
                    <div class="col-md-8">
                      <label for="prodName" class="form-label font-display ls-editorial small">Product Name</label>
                      <input type="text" id="prodName" class="form-control text-uppercase" required placeholder="TAILORED CASHMERE WRAP COAT" />
                    </div>
                    <div class="col-md-4">
                      <label for="prodSku" class="form-label font-display ls-editorial small">SKU Code</label>
                      <input type="text" id="prodSku" class="form-control font-mono-num text-uppercase" required placeholder="VERA-WM-8901" />
                    </div>

                    <div class="col-md-4">
                      <label for="prodCategory" class="form-label font-display ls-editorial small">Category</label>
                      <select id="prodCategory" class="form-select" required>
                        <option value="WOMAN">WOMAN</option>
                        <option value="MAN">MAN</option>
                        <option value="KIDS">KIDS</option>
                        <option value="PERFUMES">PERFUMES</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label for="prodPrice" class="form-label font-display ls-editorial small">Price (₹ INR)</label>
                      <input type="number" id="prodPrice" class="form-control font-mono-num" min="100" step="10" required placeholder="9990" />
                    </div>
                    <div class="col-md-4">
                      <label for="prodStock" class="form-label font-display ls-editorial small">Stock Quantity</label>
                      <input type="number" id="prodStock" class="form-control font-mono-num" min="0" required placeholder="15" />
                    </div>

                    <div class="col-md-6">
                      <label for="prodColorName" class="form-label font-display ls-editorial small">Colour Name</label>
                      <input type="text" id="prodColorName" class="form-control" required placeholder="Ivory" value="Obsidian Black" />
                    </div>
                    <div class="col-md-6">
                      <label for="prodColorHex" class="form-label font-display ls-editorial small">Swatch Hex</label>
                      <input type="color" id="prodColorHex" class="form-control form-control-color w-100" value="#111111" />
                    </div>

                    <div class="col-12">
                      <div class="font-display ls-editorial small mb-2">Available Sizes (India)</div>
                      <div class="d-flex flex-wrap gap-3">
                        <label class="form-check"><input class="form-check-input size-check" type="checkbox" value="XS" checked /> <span class="form-check-label small">XS</span></label>
                        <label class="form-check"><input class="form-check-input size-check" type="checkbox" value="S" checked /> <span class="form-check-label small">S</span></label>
                        <label class="form-check"><input class="form-check-input size-check" type="checkbox" value="M" checked /> <span class="form-check-label small">M</span></label>
                        <label class="form-check"><input class="form-check-input size-check" type="checkbox" value="L" checked /> <span class="form-check-label small">L</span></label>
                        <label class="form-check"><input class="form-check-input size-check" type="checkbox" value="XL" /> <span class="form-check-label small">XL</span></label>
                        <label class="form-check"><input class="form-check-input size-check" type="checkbox" value="ONE SIZE" /> <span class="form-check-label small">ONE SIZE</span></label>
                      </div>
                    </div>

                    <div class="col-12">
                      <label for="prodImage" class="form-label font-display ls-editorial small">Image URL</label>
                      <input type="text" id="prodImage" class="form-control" required />
                      <div class="d-flex flex-wrap gap-2 mt-2" id="presetGalleryBar"></div>
                    </div>

                    <div class="col-12">
                      <label for="prodDesc" class="form-label font-display ls-editorial small">Editorial Description</label>
                      <textarea id="prodDesc" class="form-control" rows="3" required placeholder="Minimalist architectural cut..."></textarea>
                    </div>

                    <div class="col-12">
                      <label for="prodComp" class="form-label font-display ls-editorial small">Composition &amp; Care</label>
                      <input type="text" id="prodComp" class="form-control" placeholder="100% Virgin Wool · Dry clean only." />
                    </div>
                  </div>

                  <div class="mt-4 d-flex gap-3">
                    <button type="submit" id="saveProdBtn" class="btn btn-vera-primary px-4">Publish Product</button>
                    <a href="admin-products.html" class="btn btn-vera-outline">Cancel</a>
                  </div>
                </form>
              </div>
            </div>

            <!-- Live Card Preview -->
            <div class="col-12 col-lg-4">
              <div class="admin-card">
                <div class="admin-kpi-label mb-3">Live Storefront Preview</div>
                <div style="aspect-ratio:3/4;overflow:hidden;border:1px solid var(--admin-border);background:#f3f3f3;" class="mb-3">
                  <img id="previewImg" src="/src/assets/images/woman_ivory_blazer_1794969112025.jpg" alt="Preview" class="w-100 h-100 object-fit-cover" referrerpolicy="no-referrer" />
                </div>
                <div id="previewCat" class="font-display ls-wide text-muted-vera" style="font-size:10px;">WOMAN</div>
                <div id="previewName" class="font-display ls-editorial small mt-1">NEW GARMENT</div>
                <div id="previewPrice" class="font-mono-num small mt-1">₹ 0.00</div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const editId = params.get('id');

        const imageInput = document.getElementById('prodImage');
        const previewImg = document.getElementById('previewImg');
        const nameInput = document.getElementById('prodName');
        const catInput = document.getElementById('prodCategory');
        const priceInput = document.getElementById('prodPrice');

        // Studio presets for instant selection
        const presets = [
          { label: 'Ivory Blazer', url: VERA.STUDIO_IMAGES.WOMAN_BLAZER },
          { label: 'Silk Dress', url: VERA.STUDIO_IMAGES.WOMAN_DRESS },
          { label: 'Trench Coat', url: VERA.STUDIO_IMAGES.WOMAN_TRENCH },
          { label: 'Leather Tote', url: VERA.STUDIO_IMAGES.WOMAN_TOTE },
          { label: 'Man Overcoat', url: VERA.STUDIO_IMAGES.MAN_COAT },
          { label: 'Linen Suit', url: VERA.STUDIO_IMAGES.MAN_SUIT },
          { label: 'Merino Knit', url: VERA.STUDIO_IMAGES.MAN_KNIT },
          { label: 'Kids Trench', url: VERA.STUDIO_IMAGES.KIDS_TRENCH },
          { label: 'Santal Perfume', url: VERA.STUDIO_IMAGES.PERFUME_SANTAL }
        ];

        const presetBar = document.getElementById('presetGalleryBar');
        presetBar.innerHTML = presets
          .map(
            (pr) =>
              '<button type="button" class="btn btn-vera-subtle py-1 px-2" style="font-size:10px;" data-preset-url="' +
              VERA.escapeHTML(pr.url) +
              '">' +
              VERA.escapeHTML(pr.label) +
              '</button>'
          )
          .join('');

        presetBar.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-preset-url]');
          if (!btn) return;
          imageInput.value = btn.getAttribute('data-preset-url');
          syncPreview();
        });

        function syncPreview() {
          previewImg.src = imageInput.value || VERA.STUDIO_IMAGES.WOMAN_BLAZER;
          document.getElementById('previewCat').textContent = catInput.value;
          document.getElementById('previewName').textContent = (nameInput.value || 'NEW GARMENT').toUpperCase();
          document.getElementById('previewPrice').textContent = VERA.formatINR(priceInput.value || 0);
        }

        imageInput.value = VERA.STUDIO_IMAGES.WOMAN_BLAZER;

        if (editId) {
          const existing = VERA.getProductById(editId);
          if (existing) {
            document.getElementById('formPageTitle').textContent = 'Edit Product — ' + existing.sku;
            document.getElementById('saveProdBtn').textContent = 'Update Product';
            document.getElementById('prodId').value = existing.id;
            nameInput.value = existing.name;
            document.getElementById('prodSku').value = existing.sku;
            catInput.value = existing.category;
            priceInput.value = existing.price;
            document.getElementById('prodStock').value = existing.stock;
            document.getElementById('prodColorName').value = existing.colorName;
            document.getElementById('prodColorHex').value = existing.colorHex || '#111111';
            imageInput.value = existing.image;
            document.getElementById('prodDesc').value = existing.description;
            document.getElementById('prodComp').value = existing.composition || '';

            document.querySelectorAll('.size-check').forEach((cb) => {
              cb.checked = (existing.sizes || []).includes(cb.value);
            });
          }
        }

        [imageInput, nameInput, catInput, priceInput].forEach((el) => {
          el.addEventListener('input', syncPreview);
        });
        syncPreview();

        document.getElementById('productForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const sizes = [...document.querySelectorAll('.size-check:checked')].map((cb) => cb.value);
          if (sizes.length === 0) sizes.push('ONE SIZE');

          const idVal = document.getElementById('prodId').value || 'VR-' + Date.now().toString().slice(-6);
          const payload = {
            id: idVal,
            sku: document.getElementById('prodSku').value.trim().toUpperCase(),
            name: nameInput.value.trim().toUpperCase(),
            category: catInput.value,
            price: Number(priceInput.value),
            stock: Number(document.getElementById('prodStock').value),
            colorName: document.getElementById('prodColorName').value.trim(),
            colorHex: document.getElementById('prodColorHex').value,
            sizes,
            image: imageInput.value.trim(),
            gallery: [imageInput.value.trim(), VERA.STUDIO_IMAGES.DETAIL_TAILOR],
            description: document.getElementById('prodDesc').value.trim(),
            composition: document.getElementById('prodComp').value.trim() || 'Natural luxury fibres · Dry clean only.'
          };

          VERA.saveProduct(payload);
          VERA.showToast(editId ? 'Product updated' : 'Product published to store');
          setTimeout(() => {
            window.location.href = 'admin-products.html';
          }, 550);
        });
      });
    </script>
  </body>
</html>
